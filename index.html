<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Hub || Florida State Roleplay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #030611;
      color: #f2f3f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Blue Background Glows matching #0082ff */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 130, 255, 0.18) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }

    .bg-glow-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 130, 255, 0.12) 0%, rgba(0,0,0,0) 70%);
      bottom: -100px;
      right: -100px;
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate-reverse;
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(10, 15, 30, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 130, 255, 0.25);
      padding: 48px 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(0, 130, 255, 0.2);
      text-align: center;
      animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Server Logo Image Badge */
    .icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      border: 2px solid rgba(0, 130, 255, 0.5);
      box-shadow: 0 0 25px rgba(0, 130, 255, 0.4);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .icon-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-sub {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #0082ff;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Links Container & Styling */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .policy-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(0, 130, 255, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      color: #f2f3f5;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .policy-link:hover {
      border-color: #0082ff;
      background: rgba(0, 130, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 130, 255, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .policy-link span {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .policy-link svg {
      width: 18px;
      height: 18px;
      stroke: #0082ff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .policy-link:hover svg {
      transform: translateX(4px);
    }

    /* Keyframe Animations */
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <div class="icon-badge">
      <img src="https://i.postimg.cc/fLDqFCgj/933343108c74cc3d661798cd4ebca0d9.png" alt="Florida State Roleplay Logo">
    </div>

    <div class="brand-sub">Florida State Roleplay</div>
    <h1>Platform Guidelines</h1>
    <p>Please review the official terms and guidelines below.</p>

    <div class="links-list">
      <a href="https://discord.com/guidelines" target="_blank" rel="noopener noreferrer" class="policy-link">
        <span>Discord Community Guidelines</span>
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>

      <a href="https://discord.com/terms" target="_blank" rel="noopener noreferrer" class="policy-link">
        <span>Discord Terms of Service</span>
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>

      <a href="https://en.help.roblox.com/hc/en-us/articles/115004647846-Roblox-Terms-of-Use" target="_blank" rel="noopener noreferrer" class="policy-link">
        <span>Roblox Terms of Service</span>
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>

      <a href="https://en.help.roblox.com/hc/en-us/articles/203313410-Roblox-Community-Standards" target="_blank" rel="noopener noreferrer" class="policy-link">
        <span>Roblox Community Standards</span>
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>
  </div>
</body>
</html>
